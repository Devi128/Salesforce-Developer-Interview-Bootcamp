<template>
    <lightning-card title="Eligible Jobs">

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                Loading eligible jobs...
            </div>
        </template>

        <!-- Jobs -->
        <template if:true={jobs}>
            <template for:each={jobs} for:item="job">

                <c-job-card
                    key={job.Id}
                    job={job}
                    onapply={handleApply}
                    onviewdetails={handleViewDetails}>
                </c-job-card>

            </template>
        <template if:true={selectedJob}>
            <c-job-details
                job={selectedJob}>
            </c-job-details>
        </template>
        </template>

        <!-- Success -->
        <template if:true={successMessage}>
            <div class="slds-p-around_medium">
                {successMessage}
            </div>
        </template>

        <!-- Error -->
        <template if:true={errorMessage}>
            <div class="slds-p-around_medium">
                {errorMessage}
            </div>
        </template>

        <!-- Loading Error -->
        <template if:true={error}>
            <div class="slds-p-around_medium">
                Unable to load eligible jobs.
            </div>
        </template>

    </lightning-card>
</template>
